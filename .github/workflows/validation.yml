name: Validate application

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:db
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r qa/workbook-requirements.txt
      - run: python scripts/qa-workbook.py validate
      - run: python -m unittest discover -s scripts -p 'test_qa*.py'
